<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socket.IO Live Chat</title>
    <style>
      * { box-sizing: border-box; }
      body { max-width: 720px; margin: 40px auto; padding: 0 20px; font-family: "Segoe UI", sans-serif; color: #172b26; background: #f4f7f6; }
      h1 { font-size: 26px; }
      #status { color: #52635d; overflow-wrap: anywhere; }
      #log { height: 360px; overflow-y: auto; padding: 16px 16px 16px 36px; border: 1px solid #becdc6; background: white; }
      #log li { padding: 6px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
      form { display: flex; gap: 8px; }
      input { min-width: 0; flex: 1; padding: 12px; border: 1px solid #8b9e94; border-radius: 4px; font: inherit; }
      button { padding: 12px 20px; border: 0; border-radius: 4px; background: #176b50; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <h1>Live Chat</h1>
    <p id="status" role="status">Connecting...</p>
    <ul id="log" aria-label="Messages" aria-live="polite"></ul>
    <form id="message-form">
      <input id="input" aria-label="Message" placeholder="Type a message" autocomplete="off" required />
      <button id="send" type="submit" disabled>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const log = document.getElementById('log');
      const status = document.getElementById('status');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      const write = (text) => {
        const li = document.createElement('li');
        li.textContent = text;
        log.appendChild(li);
        log.scrollTop = log.scrollHeight;
      };

      socket.on('connect', () => {
        status.textContent = `Connected as ${socket.id.slice(0, 4)}`;
        send.disabled = false;
      });
      socket.on('Message:new', (msg) => {
        const time = new Date(msg.at).toLocaleTimeString();
        write(`[${time}] ${msg.from}: ${msg.text}`);
      });
      socket.on('disconnect', () => {
        status.textContent = 'Disconnected. Reconnecting...';
        send.disabled = true;
      });
      socket.on('connect_error', () => {
        status.textContent = 'Cannot connect to the server. Retrying...';
        send.disabled = true;
      });

      document.getElementById('message-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!socket.connected || !text) return;
        socket.emit('message:send', text);
        input.value = '';
        input.focus();
      });
    </script>
  </body>
</html>
